name: daily-scan

on:
  schedule:
    - cron: "30 6 * * 1-5"  # 台北時間 週一至週五 14:30(台股收盤、官方資料更新後)
    - cron: "5 7 * * 1-5"    # 台北 15:05 備援(14:30 沒跑時補上)
    - cron: "0 1 * * 6"     # 台北時間 週六 09:00(美股週五收盤後，週K 完整)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
      - run: python -m scan.run --out data
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "scan: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
